name: Nova CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Ubuntu full suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runtime dependencies
        run: python -m pip install --disable-pip-version-check psutil pillow pystray requests beautifulsoup4
      - name: Compile source
        run: python -m compileall -q nova
      - name: Safe Actions and Repository Intelligence focal gate
        env:
          PYTHONPATH: nova
        run: |
          python -m unittest -v \
            tests.test_action_broker \
            tests.test_action_policy \
            tests.test_action_task_engine \
            tests.test_ui_action_approval \
            tests.test_action_tool_guards \
            tests.test_repository_intelligence \
            tests.test_repository_routing \
            tests.test_v010_windows_harness
      - name: Validated recovery handoff focal gate
        env:
          PYTHONPATH: nova
        run: |
          python -m unittest -v \
            tests.test_process_launch \
            tests.test_updater_resident \
            tests.test_recovery_handoff \
            tests.test_recovery_terminal_state \
            tests.test_update_runner \
            tests.test_recovery_bootstrap \
            tests.test_stable_recovery_bootstrap \
            tests.test_update_crash_recovery \
            tests.test_recovery_multiprocess
      - name: Pre-mutation stable recovery gap
        env:
          PYTHONPATH: nova
        run: python -m unittest -v tests.test_recovery_pre_mutation_bootstrap
      - name: Nova full test suite
        env:
          PYTHONPATH: nova
        run: python -m unittest discover -s tests -v
      - name: Required resident updater suites
        env:
          PYTHONPATH: nova
        run: |
          python -m unittest -v tests.test_updater_transaction
          python -m unittest -v tests.test_update_runner
          python -m unittest -v tests.test_updater_resident
          python -m unittest -v tests.test_updater_diagnostics
          python -m unittest -v tests.test_resident_process_ipc
          python -m unittest -v tests.test_resident_lifecycle_contract
      - name: Recovery schema v2 and gates
        env:
          PYTHONPATH: nova
        run: |
          python -m unittest -v tests.test_pip_job_object
          python -m unittest -v tests.test_recovery_bootstrap
          python -m unittest -v tests.test_recovery_update_gate
          python -m unittest -v tests.test_dependency_snapshot
          python -m unittest -v tests.test_stable_recovery_bootstrap
          python -m unittest -v tests.test_updater_entrypoint_guards
      - name: Real crash and multiprocess recovery
        env:
          PYTHONPATH: nova
        run: |
          python -m unittest -v tests.test_update_crash_recovery
          python -m unittest -v tests.test_recovery_multiprocess
      - name: Tray readiness regression
        env:
          PYTHONPATH: nova
        run: python -m unittest -v tests.test_resident_hardening.TrayReadinessTests
      - name: Updater transactional rollback
        env:
          PYTHONPATH: nova
        run: python -m unittest -v tests.test_updater_transaction
      - name: Resident process IPC regression
        env:
          PYTHONPATH: nova
        run: python -m unittest -v tests.test_resident_process_ipc tests.test_update_runner tests.test_updater_resident
      - name: Resident race-sensitive repeat
        env:
          PYTHONPATH: nova
        run: |
          python -m unittest -v tests.test_resident_hardening.TrayReadinessTests tests.test_update_runner
          python -m unittest -v tests.test_resident_hardening.TrayReadinessTests tests.test_update_runner
          python -m unittest -v tests.test_resident_hardening.TrayReadinessTests tests.test_update_runner
      - name: Resident lifecycle repeat
        env:
          PYTHONPATH: nova
        run: |
          python -m unittest -v tests.test_resident_lifecycle_contract tests.test_windows_session
          python -m unittest -v tests.test_resident_lifecycle_contract tests.test_windows_session
          python -m unittest -v tests.test_resident_lifecycle_contract tests.test_windows_session

  windows-smoke:
    name: Windows reliability smoke / Python 3.11
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runtime dependencies
        run: python -m pip install --disable-pip-version-check psutil pillow pystray requests beautifulsoup4
      - name: Compile all Nova source on Windows
        run: python -m compileall -q nova
      - name: Safe Actions and Repository Intelligence focal gate
        env:
          PYTHONPATH: nova
        run: python -m unittest -v tests.test_action_broker tests.test_action_policy tests.test_action_task_engine tests.test_ui_action_approval tests.test_action_tool_guards tests.test_repository_intelligence tests.test_repository_routing tests.test_v010_windows_harness
      - name: Validated recovery handoff focal gate
        env:
          PYTHONPATH: nova
        run: python -m unittest -v tests.test_process_launch tests.test_updater_resident tests.test_recovery_handoff tests.test_recovery_terminal_state tests.test_update_runner tests.test_recovery_bootstrap tests.test_stable_recovery_bootstrap tests.test_update_crash_recovery tests.test_recovery_multiprocess tests.test_resident_process_ipc
      - name: Pre-mutation stable recovery gap
        env:
          PYTHONPATH: nova
        run: python -m unittest -v tests.test_recovery_pre_mutation_bootstrap
      - name: Recovery bootstrap unit suite
        env:
          PYTHONPATH: nova
        run: python -m unittest -v tests.test_recovery_bootstrap
      - name: Recovery and updater gate suite
        env:
          PYTHONPATH: nova
        run: python -m unittest -v tests.test_recovery_update_gate
      - name: Dependency snapshot and stable bootstrap
        env:
          PYTHONPATH: nova
        run: |
          python -m unittest -v tests.test_dependency_snapshot
          python -m unittest -v tests.test_stable_recovery_bootstrap
          python -m unittest -v tests.test_updater_entrypoint_guards
      - name: Windows Job Object suite
        env:
          PYTHONPATH: nova
        run: python -m unittest -v tests.test_pip_job_object
      - name: Windows Job Object race repeat
        env:
          PYTHONPATH: nova
        shell: pwsh
        run: |
          1..3 | ForEach-Object {
            python -m unittest -v tests.test_pip_job_object.JobObjectWindowsIntegrationTests.test_fast_root_exit_cannot_hide_surviving_child
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Windows abrupt updater death inside Job Object must not skip
        env:
          PYTHONPATH: nova
        shell: pwsh
        run: |
          $lines = @(& python -m unittest -v tests.test_update_crash_recovery.UpdateCrashRecoveryTests.test_killing_updater_while_job_contains_dependency_leaves_no_child 2>&1 | ForEach-Object { "$_" })
          $code = $LASTEXITCODE
          $lines | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) { exit $code }
          if (($lines -join "`n") -match "skipped") {
            Write-Host "::error title=Native Job crash test skipped::This Windows-native safety test must execute, not skip."
            exit 1
          }
      - name: Real transaction crash boundaries
        env:
          PYTHONPATH: nova
        run: python -m unittest -v tests.test_update_crash_recovery
      - name: Real recovery multiprocess locking
        env:
          PYTHONPATH: nova
        run: python -m unittest -v tests.test_recovery_multiprocess
      - name: Recovery multiprocess race repeat
        env:
          PYTHONPATH: nova
        run: |
          python -m unittest -v tests.test_recovery_multiprocess
          python -m unittest -v tests.test_recovery_multiprocess
      - name: Required resident updater suites
        env:
          PYTHONPATH: nova
        run: |
          python -m unittest -v tests.test_updater_transaction
          python -m unittest -v tests.test_update_runner
          python -m unittest -v tests.test_updater_resident
          python -m unittest -v tests.test_updater_diagnostics
          python -m unittest -v tests.test_resident_process_ipc
          python -m unittest -v tests.test_resident_lifecycle_contract
      - name: Windows full test suite
        env:
          PYTHONPATH: nova
        shell: pwsh
        run: |
          $lines = @(& python -m unittest discover -s tests -v 2>&1 | ForEach-Object { "$_" })
          $code = $LASTEXITCODE
          $lines | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) {
            $interesting = @($lines | Where-Object {
              $_ -match "\.\.\. (FAIL|ERROR)$" -or
              $_ -match "^(FAIL|ERROR):" -or
              $_ -match "^Traceback \(most recent call last\):" -or
              $_ -match "AssertionError|PermissionError|OSError|RuntimeError|RecoveryJournalError|StaleJournalWriterError"
            })
            $start = [Math]::Max(0, $lines.Count - 35)
            $tail = @($lines[$start..($lines.Count - 1)])
            $summary = (@($interesting) + "--- final lines ---" + @($tail)) -join "`n"
            $escaped = $summary.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Host "::error title=Windows unittest failure::$escaped"
            exit $code
          }
      - name: Tray and resident ownership hardening
        env:
          PYTHONPATH: nova
        run: python -m unittest -v tests.test_resident_hardening
      - name: Real multiprocess lock IPC and termination
        env:
          PYTHONPATH: nova
        run: python -m unittest -v tests.test_resident_process_ipc
      - name: Real multiprocess race repeat
        env:
          PYTHONPATH: nova
        run: |
          python -m unittest -v tests.test_resident_process_ipc
          python -m unittest -v tests.test_resident_process_ipc
      - name: Windows session shutdown
        env:
          PYTHONPATH: nova
        run: python -m unittest -v tests.test_windows_session
      - name: Resident bootstrap ordering
        env:
          PYTHONPATH: nova
        run: python -m unittest -v tests.test_fast_routing_latency tests.test_core_consolidation
      - name: Resident stability repeat
        env:
          PYTHONPATH: nova
        run: |
          python -m unittest -v tests.test_resident_lifecycle_contract tests.test_update_runner tests.test_windows_session
          python -m unittest -v tests.test_resident_lifecycle_contract tests.test_update_runner tests.test_windows_session
          python -m unittest -v tests.test_resident_lifecycle_contract tests.test_update_runner tests.test_windows_session
      - name: Gaming Awareness regression suite
        env:
          PYTHONPATH: nova
        run: python -m unittest discover -s tests -p "test_gaming*.py" -v
      - name: Instant Wake and hotkey compatibility
        env:
          PYTHONPATH: nova
        run: python -m unittest discover -s tests -p "test_instant_wake_hotkeys.py" -v
      - name: Native core compatibility
        env:
          PYTHONPATH: nova
        run: python -m unittest discover -s tests -p "test_native_core.py" -v

name: Nova CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Ubuntu full suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runtime dependencies
        run: python -m pip install --disable-pip-version-check psutil pillow pystray requests beautifulsoup4
      - name: Compile source
        run: python -m compileall -q nova
      - name: Nova full test suite
        env:
          PYTHONPATH: nova
        run: python -m unittest discover -s tests -v
      - name: Resident concurrency repeat
        env:
          PYTHONPATH: nova
        run: |
          python -m unittest -v tests.test_ui_padding_safety tests.test_update_runner tests.test_fast_routing_latency
          python -m unittest -v tests.test_ui_padding_safety tests.test_update_runner tests.test_fast_routing_latency
          python -m unittest -v tests.test_ui_padding_safety tests.test_update_runner tests.test_fast_routing_latency

  windows-smoke:
    name: Windows reliability smoke / Python 3.11
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runtime dependencies
        run: python -m pip install --disable-pip-version-check psutil pillow pystray requests beautifulsoup4
      - name: Compile all Nova source on Windows
        run: python -m compileall -q nova
      - name: Resident lifecycle, instance, autostart and tray mocks
        env:
          PYTHONPATH: nova
        run: python -m unittest discover -s tests -p "test_ui_padding_safety.py" -v
      - name: Resident routes and bootstrap ordering
        env:
          PYTHONPATH: nova
        run: python -m unittest -v tests.test_fast_routing_latency tests.test_core_consolidation
      - name: Resident updater lifecycle
        env:
          PYTHONPATH: nova
        run: python -m unittest discover -s tests -p "test_update_runner.py" -v
      - name: Repeat Resident Mode race-sensitive tests
        env:
          PYTHONPATH: nova
        run: |
          python -m unittest -v tests.test_ui_padding_safety tests.test_update_runner
          python -m unittest -v tests.test_ui_padding_safety tests.test_update_runner
          python -m unittest -v tests.test_ui_padding_safety tests.test_update_runner
      - name: Gaming Awareness regression suite
        env:
          PYTHONPATH: nova
        run: python -m unittest discover -s tests -p "test_gaming*.py" -v
      - name: Instant Wake and hotkey compatibility
        env:
          PYTHONPATH: nova
        run: python -m unittest discover -s tests -p "test_instant_wake_hotkeys.py" -v
      - name: Native core compatibility
        env:
          PYTHONPATH: nova
        run: python -m unittest discover -s tests -p "test_native_core.py" -v

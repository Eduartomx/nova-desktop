name: Nova CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test runtime dependencies
        run: python -m pip install --disable-pip-version-check psutil pillow requests beautifulsoup4

      - name: Compile source
        run: python -m compileall -q nova

      - name: Nova test suite
        env:
          PYTHONPATH: ${{ github.workspace }}/nova
        run: python -m unittest discover -s tests -v

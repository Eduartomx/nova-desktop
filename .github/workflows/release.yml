name: Publish Nova Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build patch
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python tools/build_release.py --version "$VERSION" --source release_payload --out dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 \
            --title "Nova $GITHUB_REF_NAME" \
            --generate-notes
